[project]
name = "servicedesk-ai"
version = "0.1.0"
description = "Motor agéntico de Agentic ServiceDesk (Módulo I)"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.5.0",
    "langchain-openrouter==0.2.9",
    "openrouter==0.11.46",
    "pydantic==2.12.3",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
