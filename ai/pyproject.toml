# Proyecto de dependencias del Módulo I. No se empaqueta: el paquete `ai`
# se importa desde la raíz del repositorio (uv run --project ai python -m ai.run).
[project]
name = "servicedesk-ai"
version = "0.1.0"
description = "Motor agéntico de Agentic ServiceDesk (Módulo I)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
